# OTel Collector - GCP (GKE). Imagen: otel/opentelemetry-collector-contrib
# Trazas -> Jaeger (in-cluster) | Métricas -> Prometheus | Logs -> Cloud Logging
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 800
    spike_limit_mib: 200
  resourcedetection/gcp:
    detectors: [env, gcp]      # añade cloud.provider, k8s cluster, zona, etc.
    timeout: 5s
  resource:
    attributes:
      - key: deployment.platform
        value: gke
        action: upsert
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  otlp/jaeger:
    endpoint: jaeger-collector.observability.svc.cluster.local:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    send_timestamps: true
  # Logs -> Google Cloud Logging (usa Workload Identity del ServiceAccount)
  googlecloud:
    log:
      default_log_name: otel-lab
  debug:
    verbosity: basic

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection/gcp, resource, batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection/gcp, resource, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection/gcp, resource, batch]
      exporters: [googlecloud]
