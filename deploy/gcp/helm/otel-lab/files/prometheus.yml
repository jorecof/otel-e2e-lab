global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Métricas de las aplicaciones, expuestas por el Collector
  - job_name: otel-collector-apps
    honor_labels: true          # conserva job=<service.name> emitido por el Collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Telemetría interna del Collector (colas, exportaciones fallidas, CPU)
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]
