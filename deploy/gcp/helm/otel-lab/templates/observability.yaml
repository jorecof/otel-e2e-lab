# ---------- OTel Collector ----------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.collector.gcpServiceAccount | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
data:
  config.yaml: |-
{{ .Files.Get "files/otel-collector-gcp.yaml" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels: { app: otel-collector }
spec:
  replicas: 1
  selector: { matchLabels: { app: otel-collector } }
  template:
    metadata:
      labels: { app: otel-collector }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8889"
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: otel-collector
          image: {{ .Values.collector.image }}
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - { containerPort: 4317 }   # OTLP gRPC
            - { containerPort: 4318 }   # OTLP HTTP
            - { containerPort: 8889 }   # métricas de apps (Prometheus)
            - { containerPort: 8888 }   # telemetría interna
          volumeMounts:
            - { name: config, mountPath: /etc/otelcol }
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
      volumes:
        - name: config
          configMap: { name: otel-collector-config }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
spec:
  selector: { app: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
    - { name: prom-apps, port: 8889, targetPort: 8889 }
    - { name: prom-internal, port: 8888, targetPort: 8888 }
---
# ---------- Jaeger all-in-one ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels: { app: jaeger }
spec:
  replicas: 1
  selector: { matchLabels: { app: jaeger } }
  template:
    metadata:
      labels: { app: jaeger }
    spec:
      containers:
        - name: jaeger
          image: {{ .Values.jaeger.image }}
          args: ["--memory.max-traces={{ .Values.jaeger.maxTraces }}"]
          env:
            - { name: COLLECTOR_OTLP_ENABLED, value: "true" }
          ports:
            - { containerPort: 16686 }  # UI
            - { containerPort: 4317 }   # OTLP
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
spec:
  selector: { app: jaeger }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
---
# UI de Jaeger: ClusterIP + `kubectl port-forward` (un LoadBalancer costaría por hora)
apiVersion: v1
kind: Service
metadata:
  name: jaeger-ui
spec:
  type: {{ .Values.service.type }}
  selector: { app: jaeger }
  ports:
    - { port: 16686, targetPort: 16686 }
