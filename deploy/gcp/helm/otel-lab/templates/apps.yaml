# ---------- service-b (inventario) ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b
  labels: { app: service-b }
spec:
  replicas: {{ .Values.replicas.serviceB }}
  selector: { matchLabels: { app: service-b } }
  template:
    metadata:
      labels: { app: service-b }
    spec:
      containers:
        - name: service-b
          image: "{{ .Values.image.registry }}/service-b:{{ .Values.image.tag }}"
          # Sin esto Kubernetes reutiliza la imagen cacheada en el nodo
          # y el pod sigue ejecutando el codigo anterior.
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 8001 }]
          env:
            - { name: OTEL_ENABLED, value: "true" }
            - { name: OTEL_SERVICE_NAME, value: service-b }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4317" }
            - { name: DATABASE_URL, value: "postgresql+psycopg2://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres:5432/{{ .Values.postgres.database }}" }
            - { name: DEPLOY_ENV, value: gke }
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
---
apiVersion: v1
kind: Service
metadata:
  name: service-b
spec:
  selector: { app: service-b }
  ports: [{ port: 8001, targetPort: 8001 }]
---
# ---------- service-a (órdenes) ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
  labels: { app: service-a }
spec:
  replicas: {{ .Values.replicas.serviceA }}
  selector: { matchLabels: { app: service-a } }
  template:
    metadata:
      labels: { app: service-a }
    spec:
      containers:
        - name: service-a
          image: "{{ .Values.image.registry }}/service-a:{{ .Values.image.tag }}"
          # Sin esto Kubernetes reutiliza la imagen cacheada en el nodo
          # y el pod sigue ejecutando el codigo anterior.
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 8000 }]
          env:
            - { name: OTEL_ENABLED, value: "true" }
            - { name: OTEL_SERVICE_NAME, value: service-a }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4317" }
            - { name: SERVICE_B_URL, value: "http://service-b:8001" }
            - { name: DEPLOY_ENV, value: gke }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
---
apiVersion: v1
kind: Service
metadata:
  name: service-a
spec:
  type: {{ .Values.service.type }}
  selector: { app: service-a }
  ports: [{ port: 8000, targetPort: 8000 }]
---
# ---------- PostgreSQL (solo para el laboratorio) ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: {{ .Values.postgres.user | quote }} }
            - { name: POSTGRES_PASSWORD, value: {{ .Values.postgres.password | quote }} }
            - { name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }} }
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
