image:
  registry: REGION-docker.pkg.dev/PROJECT/otel-lab   # sobrescrito por Terraform
  tag: "1.0.0"

# Perfil costo cero: 1 réplica por servicio.
# GKE Autopilot cobra por recursos solicitados, así que cada pod pide el mínimo
# que admite Autopilot (250m vCPU / 512Mi), con ratio memoria:CPU válido (2:1).
replicas:
  serviceA: 1
  serviceB: 1

resources:
  requests:
    cpu: 250m
    memory: 512Mi

# ClusterIP en lugar de LoadBalancer: un balanceador de Google cuesta ~0,025 USD/h
# por regla de reenvío. Para el laboratorio se accede con `kubectl port-forward`,
# que no tiene costo. Cambia a LoadBalancer solo si necesitas exposición pública.
service:
  type: ClusterIP

collector:
  image: otel/opentelemetry-collector-contrib:0.116.1
  gcpServiceAccount: ""     # sobrescrito por Terraform (Workload Identity)

jaeger:
  image: jaegertracing/all-in-one:1.62.0
  maxTraces: 5000           # acota la memoria del almacenamiento en RAM

postgres:
  image: postgres:16-alpine
  user: otel
  password: otel            # en producción: usar Secret Manager
  database: inventory
