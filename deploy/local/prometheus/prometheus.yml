global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # Métricas de las aplicaciones exportadas por el OTel Collector
  - job_name: otel-collector-apps
    honor_labels: true   # conserva job=<service.name> emitido por el Collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Telemetría interna del Collector (colas, exportaciones fallidas, CPU)
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]
