# OTel Collector - entorno LOCAL (docker-compose)
# Pipeline: OTLP (gRPC+HTTP) -> memory_limiter -> resource -> batch -> backends
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # SIEMPRE primero: protege al Collector de OOM bajo picos de carga
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
  # Enriquece todos los datos con atributos del entorno de despliegue
  resource:
    attributes:
      - key: deployment.platform
        value: docker-compose
        action: upsert
      - key: collector.name
        value: otel-collector-local
        action: upsert
  # Agrupa en lotes para reducir llamadas de red a los backends
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  # Trazas -> Jaeger (Jaeger >= 1.35 acepta OTLP nativo)
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  # Métricas -> endpoint /metrics scrapeado por Prometheus
  prometheus:
    endpoint: 0.0.0.0:8889
    send_timestamps: true
    metric_expiration: 5m
  # Logs -> Loki (ingesta OTLP nativa de Loki 3.x)
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888   # métricas internas del Collector (errores, colas, CPU)
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/jaeger, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/loki]
