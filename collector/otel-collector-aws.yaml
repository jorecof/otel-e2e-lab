# OTel Collector - AWS (ECS Fargate, sidecar). Imagen: aws-otel-collector (ADOT)
# Perfil COSTO CERO: solo servicios cubiertos por el free tier de AWS.
#   Trazas   -> AWS X-Ray            (free tier: 100.000 trazas registradas/mes)
#   Métricas -> endpoint Prometheus  (scrapeado por la task de Prometheus del cluster)
#   Logs     -> CloudWatch Logs      (free tier: 5 GB de ingesta/mes)
# Nota: NO se usa Amazon Managed Prometheus (AMP) porque cobra por ingesta desde
# la primera muestra; el exporter `prometheus` local cumple la misma función sin costo.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 160          # ajustado al tamaño de task reducido (512 MB)
    spike_limit_mib: 40
  resourcedetection/ecs:
    detectors: [env, ecs]   # añade cloud.provider, aws.ecs.task.arn, etc.
    timeout: 5s
  resource:
    attributes:
      - key: deployment.platform
        value: ecs-fargate
        action: upsert
  # Para acotar X-Ray al free tier bajo carga sostenida, muestrea en el SDK
  # (head-based, sin costo de red): en la task de la aplicación define
  #   OTEL_TRACES_SAMPLER=parentbased_traceidratio
  #   OTEL_TRACES_SAMPLER_ARG=0.1
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  # Trazas -> X-Ray (el IAM Task Role usa AWSXRayDaemonWriteAccess)
  awsxray:
    region: ${env:AWS_REGION}
    index_all_attributes: true
  # Métricas -> expuestas para scrape de Prometheus (sin costo)
  prometheus:
    endpoint: 0.0.0.0:8889
    send_timestamps: true
    metric_expiration: 5m
  # Logs -> CloudWatch Logs (trace_id queda en cada evento para correlación)
  awscloudwatchlogs:
    region: ${env:AWS_REGION}
    log_group_name: /otel-lab/services
    log_stream_name: otel-collector

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection/ecs, resource, batch]
      exporters: [awsxray]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection/ecs, resource, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection/ecs, resource, batch]
      exporters: [awscloudwatchlogs]
